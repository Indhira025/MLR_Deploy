<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profit Prediction | Flask App</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Ultra&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          crossorigin="anonymous">

    <style>
        body {
            background-color: #87ceeb;
            min-height: 100vh;
        }
        .card {
            margin-top: 50px;
            padding: 30px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center">
    <div class="card text-center shadow col-md-6">

        <h1 class="mb-4">💼 Profit Prediction</h1>

        <!-- FORM -->
        <form action="/predict" method="POST">

            <div class="form-group">
                <input type="number" step="0.1" name="RD"
                       class="form-control"
                       placeholder="Enter R&D Spend" required>
            </div>

            <div class="form-group">
                <input type="number" step="0.1" name="Admin"
                       class="form-control"
                       placeholder="Enter Administration Spend" required>
            </div>

            <div class="form-group">
                <input type="number" step="0.1" name="Marketing"
                       class="form-control"
                       placeholder="Enter Marketing Spend" required>
            </div>

            <div class="form-group">
                <select name="State" class="form-control" required>
                    <option value="" disabled selected>Select State</option>
                    <option value="0">California</option>
                    <option value="1">Florida</option>
                    <option value="2">New York</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success btn-block">
                Predict Profit
            </button>
        </form>

        <!-- OUTPUT -->
        {% if prediction_text %}
        <h4 class="mt-4 text-primary">
            <strong>Predicted Profit: {{ prediction_text }}</strong>
        </h4>
        {% endif %}

        <hr>

        <h5 class="mt-3">Project By <strong>Indhira</strong></h5>
        <p class="text-muted">Data Analysis & Machine Learning</p>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

</body>
</html>
